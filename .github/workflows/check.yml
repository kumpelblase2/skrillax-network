on:
  push:
    branches: [ master ]
  pull_request:

name: check
jobs:
  fmt:
    runs-on: ubuntu-latest
    name: nightly fmt
    steps:
      - uses: actions/checkout@v6
      - name: install toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: cargo fmt check
        run: cargo +nightly fmt --check
  clippy:
    runs-on: ubuntu-latest
    name: clippy
    steps:
      - uses: actions/checkout@v6
      - name: install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo clippy
        run: cargo clippy
  semver-checks:
    runs-on: ubuntu-latest
    name: semver checks
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check semver
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@v2
  deny-check:
    runs-on: ubuntu-latest
    name: cargo deny
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: stable
          command: check
